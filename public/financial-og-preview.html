<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PFH - Portfolio Financial Hub - Open Graph Image</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    
    .og-image {
      width: 1200px;
      height: 630px;
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      position: relative;
      overflow: hidden;
    }
    
    .grid-pattern {
      position: absolute;
      width: 100%;
      height: 100%;
      opacity: 0.1;
      background-image: 
        repeating-linear-gradient(0deg, transparent, transparent 157px, rgba(255,255,255,0.3) 157px, rgba(255,255,255,0.3) 158px),
        repeating-linear-gradient(90deg, transparent, transparent 299px, rgba(255,255,255,0.3) 299px, rgba(255,255,255,0.3) 300px);
    }
    
    .logo-circle {
      position: absolute;
      left: 100px;
      top: 215px;
      width: 200px;
      height: 200px;
      background: rgba(255,255,255,0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .logo-inner {
      width: 160px;
      height: 160px;
      background: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 54px;
      color: #10B981;
      font-weight: bold;
      letter-spacing: 2px;
    }
    
    .content {
      position: relative;
      padding: 150px 0 0 350px;
      color: white;
    }
    
    .title {
      font-size: 64px;
      font-weight: bold;
      margin-bottom: 15px;
      line-height: 1.2;
    }
    
    .subtitle {
      font-size: 28px;
      opacity: 0.9;
      margin-bottom: 35px;
    }
    
    .features {
      display: flex;
      gap: 20px;
    }
    
    .feature-pill {
      padding: 10px 30px;
      background: rgba(255,255,255,0.2);
      border-radius: 20px;
      font-size: 18px;
    }
    
    .chart-bars {
      position: absolute;
      right: 100px;
      bottom: 80px;
      display: flex;
      gap: 15px;
      align-items: flex-end;
      opacity: 0.6;
    }
    
    .bar {
      width: 40px;
      background: white;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <div class="og-image">
    <div class="grid-pattern"></div>
    
    <div class="logo-circle">
      <div class="logo-inner">PFH</div>
    </div>
    
    <div class="content">
      <div class="title">Portfolio Financial Hub</div>
      <div class="subtitle">Economic Input/Output Management System</div>
      <div class="features">
        <div class="feature-pill">💰 Transactions</div>
        <div class="feature-pill">📊 Analytics</div>
        <div class="feature-pill">📈 Reports</div>
      </div>
    </div>
    
    <div class="chart-bars">
      <div class="bar" style="height: 80px;"></div>
      <div class="bar" style="height: 120px;"></div>
      <div class="bar" style="height: 100px;"></div>
      <div class="bar" style="height: 140px;"></div>
    </div>
  </div>
</body>
</html>
