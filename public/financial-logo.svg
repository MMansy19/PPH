<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="256" cy="256" r="256" fill="#10B981"/>
  
  <!-- Inner Circle for Badge Effect -->
  <circle cx="256" cy="256" r="200" fill="white" opacity="0.1"/>
  
  <!-- PFH Text -->
  <text x="256" y="290" font-family="system-ui, -apple-system, sans-serif" font-size="140" font-weight="bold" fill="white" text-anchor="middle">PFH</text>
  
  <!-- Subtitle -->
  <text x="256" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="white" text-anchor="middle" opacity="0.9">Financial</text>
  
  <!-- Chart Bars Background -->
  <g opacity="0.3">
    <rect x="140" y="120" width="24" height="50" rx="4" fill="white"/>
    <rect x="180" y="90" width="24" height="80" rx="4" fill="white"/>
    <rect x="220" y="110" width="24" height="60" rx="4" fill="white"/>
  </g>
  
  <!-- Dollar Sign Accent -->
  <circle cx="380" cy="150" r="40" fill="white" opacity="0.2"/>
  <text x="380" y="168" font-family="system-ui" font-size="48" font-weight="bold" fill="white" text-anchor="middle">$</text>
</svg>
